<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8"/>
    <title>Basic controls: Task 2</title>
    <style>
      body {
        background-color: #fff;
        color: #333;
        font: 1em / 1.4 Helvetica Neue, Helvetica, Arial, sans-serif;
        padding: 1em;
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }
      ul {
        list-style: none;
      }
    </style>
  </head>

  <body>
    <form>
      <fieldset>
        <legend>Who is your favorite pony?</legend>
        <ul>
          <li>
            <input type="radio" name="fav pony" id="pinkie" checked> 
            <label for="pinkie">Pinkie Pie</label>
                   

          </li>
          <li>
            <input type="radio" name="fav pony" id="rainbow">            
            <label for="rainbow">Rainbow Dash</label>
          </li>
          <li>
            <input type="radio" name="fav pony" id="twilight">           
            <label for="twilight">Twilight Sparkle</label>
          </li>
        </ul>
      </fieldset>
      <fieldset>
        <legend>Hotdog preferences</legend>
        <ul>
          <li>
            <input type="checkbox" name="hotdog preferences" id="vegan">
            <label for="vegan">Vegan</label>

          </li>
          <li>
            <input type="checkbox" name="hotdog preferences" id="onions">
            <label for="onions">Onions</label>

          </li>

          <li>
            <input type="checkbox" name="hotdog preferences" id="cold-dog">
            <label for="cold-dog">Cold Dog</label>
          </li>
        </ul>
      </fieldset>
      <button>Submit</button>
    </form>
  </body>

</html>
