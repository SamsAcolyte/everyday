<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8"/>
    <title>Form structure: Task 1</title>
    <style>
      body {
        background-color: #fff;
        color: #333;
        font: 1em / 1.4 Helvetica Neue, Helvetica, Arial, sans-serif;
        padding: 1em;
        margin: 0;
      }

      * {
        box-sizing: border-box;
      }

    ul {
      list-style: none;
    }
    </style>
  </head>

  <body>
    <form>
      <fieldset>
        <legend>Log in</legend>
        <ul>
          <li><label for="id">User ID</label></li>
          <li><input type="text" name="id" id="id"></li>
          <li><label for="password">Password</label></li>
          <li><input type="password" name="pwd" id="password"></li>
          <li><button type="submit" >Log in</button></li>
        </ul>
      </fieldset>
    </form>
        
  </body>

</html>
